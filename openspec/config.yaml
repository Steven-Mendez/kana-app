schema: spec-driven

context: |
  Kana is a mobile-first Expo / React Native application with web support.
  Stack: Expo SDK 58, React 19.3, React Native 0.88, TypeScript (strict).
  Package manager: pnpm, using the version pinned in package.json.
  Follow AGENTS.md for project conventions and versioned Expo documentation.
  Install dependencies with pnpm exec expo install.

rules:
  tasks:
    - Include pnpm lint and pnpm exec tsc --noEmit in verification.
